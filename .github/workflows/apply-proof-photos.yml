name: Apply proof photos patch

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/apply_proof_photos.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch to index.html
        run: python3 tools/apply_proof_photos.py

      - name: Commit result
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html unchanged - nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add camera proof photos to task detail modal"
          git push
