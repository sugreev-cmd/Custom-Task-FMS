name: Apply proof photos patch

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/**.py'
      - '.github/workflows/apply-proof-photos.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply every patch script in tools/
        run: |
          set -e
          for f in tools/*.py; do
            echo "--- running $f"
            python3 "$f"
          done

      - name: Commit result
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html unchanged - nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Apply Task FMS patch scripts to index.html"
          git push
